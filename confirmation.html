<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dreamy Movies — Your ticket</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ctext y='32' font-size='32'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="brand__logo" aria-hidden="true">🎬</span>
      Dreamy <span>Movies</span>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="movies.html">Movies</a>
      <a href="upcoming.html">Upcoming</a>
      <a href="bookings.html">My bookings</a>
      <a href="contact.html">Contact</a>
    </nav>
    <form class="header-search" id="header-search-form" role="search">
      <input type="text" id="header-search" placeholder="Search movies…" aria-label="Search movies" />
      <button type="submit" aria-label="Search">🔍</button>
    </form>
  </header>

  <main class="confirmation-page" id="ticket-result">
    <p class="eyebrow">Booking confirmed</p>
    <h1>You're going. Here's your ticket.</h1>

    <div class="ticket-stub-final">
      <div class="ticket-stub-final__top">
        <span id="ticket-movie"></span>
        <dl>
          <dt>Screen</dt>
          <dd id="ticket-screen"></dd>
          <dt>Date</dt>
          <dd id="ticket-date"></dd>
          <dt>Showtime</dt>
          <dd id="ticket-showtime"></dd>
          <dt>Ticket</dt>
          <dd id="ticket-tier"></dd>
          <dt>Booked by</dt>
          <dd id="ticket-buyer"></dd>
          <dt>Total paid</dt>
          <dd id="ticket-total"></dd>
        </dl>
      </div>
      <div class="ticket-stub-final__bottom">
        <div>
          <span class="ticket-stub-final__ref-label">Reference</span>
          <span class="ticket-stub-final__ref" id="ticket-reference"></span>
        </div>
        <div class="barcode" aria-hidden="true">
          <span style="height:60%"></span><span style="height:90%"></span><span style="height:40%"></span>
          <span style="height:75%"></span><span style="height:100%"></span><span style="height:55%"></span>
          <span style="height:85%"></span><span style="height:30%"></span><span style="height:70%"></span>
          <span style="height:95%"></span><span style="height:45%"></span><span style="height:65%"></span>
        </div>
      </div>
    </div>

    <div class="confirmation-actions">
      <button class="primary" onclick="window.print()">Print ticket</button>
      <a href="bookings.html">My bookings</a>
      <a href="movies.html">Book another</a>
    </div>
  </main>

  <footer class="site-footer">
    Dreamy Movies · A student project. Bookings are saved in your own browser only.
  </footer>

  <script src="script.js"></script>
</body>
</html>
